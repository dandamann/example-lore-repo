fields:
  name:
    type: string
    required: true
  status:
    type: enum
    required: true
    values: [alive, dead, unknown, missing]
  faction:
    type: ref
    required: false
    ref_type: faction
  location:
    type: ref
    required: false
    ref_type: location
    description: where the npc lives
  test:
    type: string
    required: false
relationships:
  types:
    - sibling
    - parentchild
    - mentor
    - rival
